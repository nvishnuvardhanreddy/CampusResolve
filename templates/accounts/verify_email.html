{% extends 'base.html' %}{% block title %}Verify email · Campus Resolve{% endblock %}{% block content %}<div class="panel narrow"><div class="eyebrow">EMAIL VERIFICATION</div><h1>Check your inbox</h1><p>Enter the six-digit code sent to <strong>{{ email }}</strong>. It expires in 10 minutes.</p><form method="post">{% csrf_token %}<label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><button class="button">Verify email</button></form><form method="post" action="{% url 'resend_code' %}" class="resend">{% csrf_token %}<button class="link-button">Send a new code</button></form></div>{% endblock %}
